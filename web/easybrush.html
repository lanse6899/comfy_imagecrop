                    state.selectedTextElement.color = e.target.value;
                    updateTextElementDOM(state.selectedTextElement);
                }
            });
            document.getElementById('fgHex').addEventListener('change', (e) => {
                const color = e.target.value;
                if (/^#[0-9A-Fa-f]{6}$/.test(color)) {
                    state.foregroundColor = color;
                    document.getElementById('foregroundColor').value = color;
                    document.getElementById('fgPreview').style.background = color;
                    // 立即更新选中文字的颜色
                    if (state.selectedTextElement) {
                        state.selectedTextElement.color = color;
                        updateTextElementDOM(state.selectedTextElement);
                    }
                }
            });

            // 混合模式
            document.getElementById('blendMode').addEventListener('change', (e) => {
                state.blendMode = e.target.value;
            });

            // 滑块控制
            setupSlider('brushSize', (val) => {
                state.brushSize = parseInt(val);
                document.getElementById('sizeValue').textContent = val + ' px';
            });
            setupSlider('brushHardness', (val) => {
                state.brushHardness = parseInt(val);
                document.getElementById('hardnessValue').textContent = val + '%';
            });
            setupSlider('brushOpacity', (val) => {
                state.brushOpacity = parseInt(val);
                document.getElementById('opacityValue').textContent = val + '%';
            });
            setupSlider('brushFlow', (val) => {
                state.brushFlow = parseInt(val);
                document.getElementById('flowValue').textContent = val + '%';
            });
            setupSlider('brushSpacing', (val) => {
                state.brushSpacing = parseInt(val);
                document.getElementById('spacingValue').textContent = val + '%';
            });

            // 画布交互 - 在 doodleCanvas 上处理（因为绘制在这个层）
            doodleCanvas.addEventListener('pointerdown', handlePointerDown);
            doodleCanvas.addEventListener('pointermove', handlePointerMove);
            doodleCanvas.addEventListener('pointerup', handlePointerUp);
            doodleCanvas.addEventListener('pointerleave', handlePointerLeave);
            doodleCanvas.addEventListener('wheel', handleWheel, { passive: false });

            // 右键临时切换到橡皮擦
            doodleCanvas.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });

            // 拖拽上传
            canvasArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'copy';
            });
            canvasArea.addEventListener('drop', handleDrop);
            
            // 点击空白处取消文字选择
            canvasArea.addEventListener('click', (e) => {
                if (e.target === doodleCanvas || e.target === mainCanvas) {
                    deselectAllText();
                }
            });
            
            // 点击上传提示区域也可以上传
            uploadHint.addEventListener('click', triggerFileInput);

            // 空格键 - 临时激活抓手工具
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            
            // 文字拖拽事件（document 级别，确保拖拽时不会丢失）
            document.addEventListener('mousemove', handleTextDrag);
            document.addEventListener('mouseup', handleTextDragEnd);

            // 文字工具相关事件
            document.getElementById('fontSize').addEventListener('input', (e) => {
                state.fontSize = parseInt(e.target.value);
                document.getElementById('fontSizeValue').textContent = e.target.value + ' px';
                updateSelectedText();
            });
            document.getElementById('fontBold').addEventListener('click', () => {
                state.fontBold = !state.fontBold;
                document.getElementById('fontBold').classList.toggle('active', state.fontBold);
                updateSelectedText();
            });
            document.getElementById('fontItalic').addEventListener('click', () => {
                state.fontItalic = !state.fontItalic;
                document.getElementById('fontItalic').classList.toggle('active', state.fontItalic);
                updateSelectedText();
            });
            document.getElementById('fontUnderline').addEventListener('click', () => {
                state.fontUnderline = !state.fontUnderline;
                document.getElementById('fontUnderline').classList.toggle('active', state.fontUnderline);
                updateSelectedText();
            });

            // 文字输入弹窗事件
            document.getElementById('cancelTextBtn').addEventListener('click', hideTextInput);
            document.getElementById('confirmTextBtn').addEventListener('click', confirmTextInput);
            document.getElementById('textInputContent').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    // Enter 换行（默认行为）
                    // 阻止默认，因为 textarea 会自动换行
                }
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    confirmTextInput();
                }
                if (e.key === 'Escape') {
                    hideTextInput();
                }
            });
        }

        function setupSlider(id, callback) {
            const slider = document.getElementById(id);
            slider.addEventListener('input', (e) => callback(e.target.value));
        }

        // ==================== 工具选择 ====================
        function selectTool(tool) {
            state.tool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tool + 'Tool').classList.add('active');
            updateCursor();
        }

        function selectShape(shape) {
            state.brushShape = shape;
            document.getElementById('circleShape').classList.toggle('active', shape === 'circle');
            document.getElementById('squareShape').classList.toggle('active', shape === 'square');
            updateCurrentBrushDisplay();
        }

        function selectFillType(type) {
            state.fillType = type;
            document.getElementById('fillSolid').classList.toggle('active', type === 'solid');
            document.getElementById('fillStroke').classList.toggle('active', type === 'stroke');
            document.getElementById('strokeWidthRow').style.display = type === 'stroke' ? 'flex' : 'none';
        }

        // ==================== 画笔绘制 ====================
        function handlePointerDown(e) {
            if (!state.imageLoaded) return;
            
            // 右键临时切换到橡皮擦
            const isRightClick = e.button === 2;
            const wasEraser = state.tool === 'eraser';
            if (isRightClick && !wasEraser) {
                state.tool = 'eraser';
            }
            
            // 检查是否点击到文字元素
            const clickedText = getTextElementAtPoint(e);
            if (clickedText) {
                // 点击到文字，这由文字自己的事件处理，这里只需要返回
                return;
            }
            
            // 取消文字选中
            deselectAllText();
            
            // 清除悬停预览
            state.lastPoint = null;
            updatePreviewCanvas();
            
            // 按住空格键临时激活抓手
            if (state.isSpacePressed || state.tool === 'move') {
                state.isPanning = true;
                state.lastX = e.clientX;
                state.lastY = e.clientY;
                canvasArea.style.cursor = 'grabbing';
                return;
            }

            const point = getCanvasPoint(e);

            // 矩形、圆形、箭头工具：开始绘制形状
            if (state.tool === 'rect' || state.tool === 'ellipse') {
                saveToUndoStack(); // 开始绘制前保存状态
                state.isDrawing = true;
                state.shapeStartPoint = { x: point.x, y: point.y };
                return;
            }
            
            // 曲线箭头工具：开始记录路径点
            if (state.tool === 'arrow') {
                saveToUndoStack(); // 开始绘制前保存状态
                state.isDrawing = true;
                state.arrowPoints = [{ x: point.x, y: point.y }];
                state.lastPoint = point;
                return;
            }
            
            // 文字工具
            if (state.tool === 'text') {
                // 先取消其他选中
                deselectAllText();
                // 显示文字输入弹窗
                state.textInputPosition = { x: point.x, y: point.y };
                showTextInput();
                return;
            }

            if (state.tool === 'eraser') {
                // 橡皮擦在涂鸦层操作
                saveToUndoStack(); // 开始绘制前保存状态
                state.isDrawing = true;
                state.lastPoint = point;
                const pressure = e.pressure || 0.5;
                drawBrushStroke(point.x, point.y, point.x, point.y, pressure);
            } else {
                saveToUndoStack(); // 开始绘制前保存状态
                state.isDrawing = true;
                state.lastPoint = point;
                
                // 获取压力
                const pressure = e.pressure || 0.5;
                
                // 绘制初始点
                drawBrushStroke(point.x, point.y, point.x, point.y, pressure);
            }
        }

        function handlePointerMove(e) {
            point = getCanvasPoint(e);
            document.getElementById('cursorX').textContent = Math.round(point.x);
            document.getElementById('cursorY').textContent = Math.round(point.y);

            if (state.isPanning) {
                const dx = e.clientX - state.lastX;
                const dy = e.clientY - state.lastY;
                state.panX += dx;
                state.panY += dy;
                state.lastX = e.clientX;
                state.lastY = e.clientY;
                updateCanvasTransform();
                return;
            }

            // 文字拖拽现在由 document 级别的 handleTextDrag 处理
            
            if (!state.imageLoaded) return;

            // 矩形、圆形：实时预览
            if (state.isDrawing && (state.tool === 'rect' || state.tool === 'ellipse')) {
                drawShapePreview(state.shapeStartPoint, point);
                return;
            }
            
            // 曲线箭头：记录路径点
            if (state.isDrawing && state.tool === 'arrow') {
                const distance = Math.sqrt((point.x - state.lastPoint.x) ** 2 + (point.y - state.lastPoint.y) ** 2);
                const spacing = Math.max(2, state.brushSpacing / 10); // 曲线点间距
                if (distance >= spacing) {
                    state.arrowPoints.push({ x: point.x, y: point.y });
                    state.lastPoint = point;
                    drawCurveArrowPreview();
                }
                return;
            }

            if (state.isDrawing) {
                // 正在绘制
                const pressure = e.pressure || 0.5;
                drawBrushStroke(state.lastPoint.x, state.lastPoint.y, point.x, point.y, pressure);
                state.lastPoint = point;
            }
            // 只在绘制时更新预览光标
            if (state.isDrawing && state.lastPoint) {
                updatePreviewCanvas();
            } else {
                // 非绘制状态清除预览
                previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            }
        }

        function handlePointerUp(e) {
            // 右键临时切换回来
            if (e.button === 2 && state.tool === 'eraser') {
                state.tool = 'brush';
            }
            
            if (state.isPanning) {
                state.isPanning = false;
                updateCursor();
                return;
            }

            // 形状工具：完成绘制
            if (state.isDrawing && (state.tool === 'rect' || state.tool === 'ellipse')) {
                const endPoint = getCanvasPoint(e);
                drawShape(state.shapeStartPoint, endPoint);
                state.isDrawing = false;
                state.shapeStartPoint = null;
                clearShapePreview();
                // 通知父窗口绘制完成
                window.parent.postMessage({ type: 'USER_DREW' }, '*');
                return;
            }
            
            // 曲线箭头：完成绘制
            if (state.isDrawing && state.tool === 'arrow') {
                drawCurveArrow();
                state.isDrawing = false;
                state.arrowPoints = [];
                // 通知父窗口绘制完成
                window.parent.postMessage({ type: 'USER_DREW' }, '*');
                return;
            }

            // 文字拖拽结束现在由 document 级别的 handleTextDragEnd 处理

            if (state.isDrawing) {
                state.isDrawing = false;
                // 通知父窗口绘制完成
                window.parent.postMessage({ type: 'USER_DREW' }, '*');
            }
        }

        // ==================== 文字功能 ====================
        function getTextElementAtPoint(e) {
            const containerRect = canvasContainer.getBoundingClientRect();
            const x = (e.clientX - containerRect.left) / state.zoom;
            const y = (e.clientY - containerRect.top) / state.zoom;
            
            // 检查是否点击到任何文字元素（从最新的开始检查）
            for (let i = state.textElements.length - 1; i >= 0; i--) {
                const text = state.textElements[i];
                // 创建临时 canvas 测量文字宽度
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.font = `${text.bold ? 'bold ' : ''}${text.italic ? 'italic ' : ''}${text.fontSize}px "Segoe UI", sans-serif`;
                const metrics = tempCtx.measureText(text.text);
                const textWidth = metrics.width;
                const textHeight = text.fontSize * 1.2;
                
                // 检查点击位置是否在文字范围内
                if (x >= text.x && x <= text.x + textWidth &&
                    y >= text.y - textHeight * 0.7 && y <= text.y + textHeight * 0.3) {
                    return text;
                }
            }
            return null;
        }

        function showTextInput() {
            const overlay = document.getElementById('textInputOverlay');
            const textarea = document.getElementById('textInputContent');
            textarea.value = '';
            overlay.classList.remove('hidden');
            textarea.focus();
        }

        function hideTextInput() {
            const overlay = document.getElementById('textInputOverlay');
            overlay.classList.add('hidden');
            state.textInputPosition = null;
        }

        function confirmTextInput() {
            const textarea = document.getElementById('textInputContent');
            const text = textarea.value.trim();
            
            if (text && state.textInputPosition) {
                createTextElement(text, state.textInputPosition.x, state.textInputPosition.y);
                // 通知父窗口用户开始绘制
                window.parent.postMessage({ type: 'USER_DREW' }, '*');
                // 同步数据到父窗口
                syncTextData();
            }
            
            hideTextInput();
        }

        function createTextElement(text, x, y) {
            const textLayer = document.getElementById('textLayer');
            const id = Date.now();
            
            const textData = {
                id: id,
                text: text,
                x: x,
                y: y,
                fontSize: state.fontSize,
                color: state.foregroundColor,
                bold: state.fontBold,
                italic: state.fontItalic,
                underline: state.fontUnderline
            };
            
            console.log('createTextElement: fontSize =', textData.fontSize, 'text =', text);
            
            state.textElements.push(textData);
            
            // 创建 DOM 元素
            const el = document.createElement('div');
            el.className = 'text-element';
            el.id = 'text-' + id;
            el.dataset.id = id;
            el.innerHTML = text.replace(/\n/g, '<br>') + '<button class="delete-btn" onclick="deleteTextElement(' + id + ')">×</button>';
            
            updateTextElementDOM(textData, el);
            
            // 添加拖拽事件
            el.addEventListener('mousedown', onTextMouseDown);
            el.addEventListener('click', onTextClick);
            el.addEventListener('dblclick', onTextDblClick);
            
            textLayer.appendChild(el);
            selectTextElement(id);
        }

        function onTextClick(e) {
            // 只是选中文字，不触发拖拽
            e.stopPropagation();
        }

        function onTextDblClick(e) {
            if (e.target.classList.contains('delete-btn')) return;
            e.stopPropagation();
            
            const id = parseInt(e.currentTarget.dataset.id);
            const textData = state.textElements.find(t => t.id === id);
            if (!textData) return;
            
            // 停止拖拽状态
            state.draggingText = false;
            state.dragStarted = false;
            
            // 创建输入框进行编辑
            editTextInPlace(textData);
        }

        function editTextInPlace(textData) {
            const el = document.getElementById('text-' + textData.id);
            if (!el) return;
            
            // 获取文字的样式
            const fontSize = textData.fontSize;
            const color = textData.color;
            const fontWeight = textData.bold ? 'bold' : 'normal';
            const fontStyle = textData.italic ? 'italic' : 'normal';
            
            // 创建编辑容器
            const editorContainer = document.createElement('div');
            editorContainer.style.cssText = `
                position: absolute;
                left: ${textData.x}px;
                top: ${textData.y}px;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                gap: 5px;
            `;
            
            // 创建 contenteditable div
            const editor = document.createElement('div');
            editor.contentEditable = true;
            editor.innerText = textData.text;
            editor.style.cssText = `
                font-size: ${fontSize}px;
                color: ${color};
                font-weight: ${fontWeight};
                font-style: ${fontStyle};
                font-family: "Segoe UI", sans-serif;
                background: rgba(0,0,0,0.6);
                border: 2px solid var(--accent-blue);
                border-radius: 2px;
                padding: 5px 10px;
                outline: none;
                min-width: 50px;
                min-height: ${fontSize + 15}px;
                white-space: pre-wrap;
                word-wrap: break-word;
                line-height: 1.4;
                width: max-content;
                max-width: 800px;
            `;
            editor.id = 'text-edit-editor';
            
            // 创建按钮容器
            const buttonRow = document.createElement('div');
            buttonRow.style.cssText = `
                display: flex;
                gap: 5px;
            `;
            
            // 取消按钮
            const cancelBtn = document.createElement('button');
            cancelBtn.innerHTML = '✕';
            cancelBtn.title = '取消 (Esc)';
            cancelBtn.style.cssText = `
                padding: 4px 10px;
                background: var(--bg-panel);
                border: 1px solid var(--border);
                border-radius: 3px;
                color: var(--text);
                cursor: pointer;
                font-size: 12px;
            `;
            cancelBtn.onclick = () => {
                editorContainer.remove();
                el.style.display = '';
            };
            
            // 确认按钮
            const confirmBtn = document.createElement('button');
            confirmBtn.innerHTML = '✓';
            confirmBtn.title = '确认 (Enter)';
            confirmBtn.style.cssText = `
                padding: 4px 10px;
                background: var(--accent-blue);
                border: none;
                border-radius: 3px;
                color: white;
                cursor: pointer;
                font-size: 12px;
            `;
            confirmBtn.onclick = () => finishEdit();
            
            // 提示
            const hint = document.createElement('span');
            hint.textContent = 'Enter换行 · Ctrl+Enter确认';
            hint.style.cssText = `
                font-size: 10px;
                color: var(--text-dim);
                white-space: nowrap;
            `;
            
            buttonRow.appendChild(cancelBtn);
            buttonRow.appendChild(confirmBtn);
            buttonRow.appendChild(hint);
            
            editorContainer.appendChild(editor);
            editorContainer.appendChild(buttonRow);
            
            // 添加到 textLayer
            const textLayer = document.getElementById('textLayer');
            textLayer.appendChild(editorContainer);
            
            // 隐藏原来的文字
            el.style.display = 'none';
            
            // 聚焦
            editor.focus();
            
            // 将光标移到末尾
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(editor);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
            
            // 完成编辑
            function finishEdit() {
                // 保存状态以便撤销
                saveToUndoStack();

                const newText = editor.innerText;
                if (newText.trim()) {
                    textData.text = newText;
                    el.innerHTML = newText.replace(/\n/g, '<br>') + '<button class="delete-btn" onclick="deleteTextElement(' + textData.id + ')">×</button>';
                    // 同步数据到父窗口
                    syncTextData();
                }
                el.style.display = '';
                editorContainer.remove();
            }
            
            // 键盘快捷键
            editor.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    finishEdit();
                } else if (e.key === 'Enter') {
                    // 普通 Enter 键：插入换行符
                    e.preventDefault();
                    document.execCommand('insertLineBreak');
                }
                if (e.key === 'Escape') {
                    e.preventDefault();
                    editorContainer.remove();
                    el.style.display = '';
                }
            });
            
            // 点击外部确认编辑
            function handleClickOutside(e) {
                if (!editorContainer.contains(e.target)) {
                    finishEdit();
                    document.removeEventListener('mousedown', handleClickOutside);
                }
            }
            setTimeout(() => document.addEventListener('mousedown', handleClickOutside), 10);
        }

        function onTextMouseDown(e) {
            if (e.target.classList.contains('delete-btn')) return;
            e.preventDefault();
            e.stopPropagation();
            
            const id = parseInt(e.currentTarget.dataset.id);
            const textData = state.textElements.find(t => t.id === id);
            if (!textData) return;
            
            selectTextElement(id);
            
            // 开始拖拽前保存状态
            saveToUndoStack();
            
            // 开始拖拽
            state.draggingText = true;
            state.dragStarted = false; // 标记是否已经开始拖拽
            const containerRect = canvasContainer.getBoundingClientRect();
            state.dragOffsetX = (e.clientX - containerRect.left) / state.zoom - textData.x;
            state.dragOffsetY = (e.clientY - containerRect.top) / state.zoom - textData.y;
            state.lastX = e.clientX;
            state.lastY = e.clientY;
        }

        function updateTextElementDOM(textData, el = null) {
            if (!el) {
                el = document.getElementById('text-' + textData.id);
            }
            if (!el) return;
            
            el.style.left = textData.x + 'px';
            el.style.top = textData.y + 'px';
            el.style.fontSize = textData.fontSize + 'px';
            el.style.color = textData.color;
            el.style.fontWeight = textData.bold ? 'bold' : 'normal';
            el.style.fontStyle = textData.italic ? 'italic' : 'normal';
            el.style.textDecoration = textData.underline ? 'underline' : 'none';
        }

        function selectTextElement(id) {
            deselectAllText();
            state.selectedTextElement = state.textElements.find(t => t.id === id);
            
            if (state.selectedTextElement) {
                const el = document.getElementById('text-' + id);
                if (el) el.classList.add('selected');
                
                console.log('selectTextElement: fontSize =', state.selectedTextElement.fontSize);
                // 更新控制面板的值
                document.getElementById('fontSize').value = state.selectedTextElement.fontSize;
                document.getElementById('fontSizeValue').textContent = state.selectedTextElement.fontSize + ' px';
                document.getElementById('fontBold').classList.toggle('active', state.selectedTextElement.bold);
                document.getElementById('fontItalic').classList.toggle('active', state.selectedTextElement.italic);
                document.getElementById('fontUnderline').classList.toggle('active', state.selectedTextElement.underline);
                
                state.fontBold = state.selectedTextElement.bold;
                state.fontItalic = state.selectedTextElement.italic;
                state.fontUnderline = state.selectedTextElement.underline;
            }
        }

        function deselectAllText() {
            state.selectedTextElement = null;
            document.querySelectorAll('.text-element').forEach(el => el.classList.remove('selected'));
        }

        function updateSelectedText() {
            if (!state.selectedTextElement) return;
            
            const el = document.getElementById('text-' + state.selectedTextElement.id);
            
            state.selectedTextElement.fontSize = state.fontSize;
            state.selectedTextElement.color = state.foregroundColor;
            state.selectedTextElement.bold = state.fontBold;
            state.selectedTextElement.italic = state.fontItalic;
            state.selectedTextElement.underline = state.fontUnderline;
            
            updateTextElementDOM(state.selectedTextElement);
            // 立即同步数据
            syncTextData();
        }

        function deleteTextElement(id) {
            // 保存状态以便撤销
            saveToUndoStack();
            
            const index = state.textElements.findIndex(t => t.id === id);
            if (index > -1) {
                state.textElements.splice(index, 1);
            }
            
            const el = document.getElementById('text-' + id);
            if (el) el.remove();
            
            if (state.selectedTextElement && state.selectedTextElement.id === id) {
                state.selectedTextElement = null;
            }

            // 同步数据到父窗口
            syncTextData();
        }

        function handlePointerLeave(e) {
            state.isDrawing = false;
            // 如果正在绘制曲线箭头，结束时清除预览
            if (state.tool === 'arrow' && state.arrowPoints.length >= 2) {
                drawCurveArrow();
                state.arrowPoints = [];
            }
            updatePreviewCanvas();
        }

        function handleWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            setZoom(state.zoom + delta);
        }

        function getCanvasPoint(e) {
            // 计算相对于画布容器的偏移
            const containerRect = canvasContainer.getBoundingClientRect();
            return {
                x: (e.clientX - containerRect.left) / state.zoom,
                y: (e.clientY - containerRect.top) / state.zoom
            };
        }

        // ==================== 绘制引擎 ====================
        function drawBrushStroke(x1, y1, x2, y2, pressure) {
            // 画笔大小 = 设置值，压力感应影响细腻度而不是基本大小
            const size = state.brushSize;
            const hardness = state.brushHardness / 100;
            const opacity = state.brushOpacity / 100;
            const flow = state.brushFlow / 100;
            const isEraser = state.tool === 'eraser';
            
            // 统一在涂鸦层绘制
            const drawCtx = doodleCtx;
            
            // 画笔颜色（橡皮擦模式下传空值）
            const brushColor = isEraser ? null : state.foregroundColor;

            // 计算笔画长度
            const distance = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
            const spacing = size * (state.brushSpacing / 100);
            
            // 使用曲线路径进行平滑绘制
            drawCtx.save();
            
            if (!isEraser) {
                // 画笔模式
                drawCtx.globalCompositeOperation = state.blendMode;
                drawCtx.globalAlpha = opacity * flow;
            }

            if (distance < spacing) {
                // 点绘制
                drawBrushDot(drawCtx, x2, y2, size, hardness, brushColor, isEraser);
            } else {
                // 路径绘制
                const steps = Math.ceil(distance / spacing);
                
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const x = x1 + (x2 - x1) * t;
                    const y = y1 + (y2 - y1) * t;
                    drawBrushDot(drawCtx, x, y, size, hardness, brushColor, isEraser);
                }
            }

            drawCtx.restore();
            
            // 更新预览画布
            updatePreviewCanvas();
        }

        function drawBrushDot(drawCtx, x, y, size, hardness, color, isEraser = false) {
            const halfSize = size / 2;
            
            if (isEraser) {
                // 橡皮擦：使用简单的方式清除
                drawCtx.save();
                drawCtx.globalCompositeOperation = 'destination-out';
                
                if (state.brushShape === 'circle') {
                    drawCtx.beginPath();
                    drawCtx.arc(x, y, halfSize, 0, Math.PI * 2);
                    drawCtx.fillStyle = 'rgba(0,0,0,1)';
                    drawCtx.fill();
                } else {
                    drawCtx.fillRect(x - halfSize, y - halfSize, size, size);
                }
                drawCtx.restore();
            } else {
                // 画笔模式
                const blurFactor = 2 * (1 - hardness);
                const blurRadius = halfSize * blurFactor;
                const outerRadius = halfSize + blurRadius;
                const colorRgba = hexToRgba(color);
                
                drawCtx.beginPath();
                if (state.brushShape === 'circle') {
                    drawCtx.arc(x, y, outerRadius, 0, Math.PI * 2);
                } else {
                    drawCtx.rect(x - outerRadius, y - outerRadius, outerRadius * 2, outerRadius * 2);
                }
                
                if (hardness < 1) {
                    const innerRadius = halfSize * hardness;
                    
                    if (state.brushShape === 'circle') {
                        const gradient = drawCtx.createRadialGradient(x, y, innerRadius, x, y, outerRadius);
                        gradient.addColorStop(0, `rgba(${colorRgba.r},${colorRgba.g},${colorRgba.b},1)`);
                        gradient.addColorStop(1, `rgba(${colorRgba.r},${colorRgba.g},${colorRgba.b},0)`);
                        drawCtx.fillStyle = gradient;
                    } else {
                        drawCtx.save();
                        drawCtx.clip();
                        const gradient = drawCtx.createRadialGradient(x, y, innerRadius, x, y, outerRadius);
                        gradient.addColorStop(0, `rgba(${colorRgba.r},${colorRgba.g},${colorRgba.b},1)`);
                        gradient.addColorStop(1, `rgba(${colorRgba.r},${colorRgba.g},${colorRgba.b},0)`);
                        drawCtx.fillStyle = gradient;
                        drawCtx.fill();
                        drawCtx.restore();
                        drawCtx.beginPath();
                        drawCtx.rect(x - outerRadius, y - outerRadius, outerRadius * 2, outerRadius * 2);
                    }
                }
                
                if (hardness === 1 || state.brushShape === 'square') {
                    drawCtx.fillStyle = color;
                }
                drawCtx.fill();
            }
        }

        // ==================== 形状绘制 ====================
        function drawShape(startPoint, endPoint) {
            const x = Math.min(startPoint.x, endPoint.x);
            const y = Math.min(startPoint.y, endPoint.y);
            const width = Math.abs(endPoint.x - startPoint.x);
            const height = Math.abs(endPoint.y - startPoint.y);

            if (width < 2 && height < 2) return; // 太小的形状不绘制

            doodleCtx.save();
            doodleCtx.fillStyle = state.foregroundColor;
            doodleCtx.strokeStyle = state.foregroundColor;
            doodleCtx.lineWidth = state.strokeWidth;

            if (state.tool === 'rect') {
                if (state.fillType === 'solid') {
                    doodleCtx.fillRect(x, y, width, height);
                } else {
                    doodleCtx.strokeRect(x, y, width, height);
                }
            } else if (state.tool === 'ellipse') {
                const centerX = x + width / 2;
                const centerY = y + height / 2;
                const radiusX = width / 2;
                const radiusY = height / 2;

                doodleCtx.beginPath();
                doodleCtx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);

                if (state.fillType === 'solid') {
                    doodleCtx.fill();
                } else {
                    doodleCtx.stroke();
                }
            } else if (state.tool === 'arrow') {
                drawArrowHead(doodleCtx, startPoint.x, startPoint.y, endPoint.x, endPoint.y);
            }

            doodleCtx.restore();
            
            // 保存状态到撤销栈
            saveToUndoStack();
        }

        function drawArrowHead(ctx, fromX, fromY, toX, toY) {
            const headLength = Math.max(15, state.brushSize * 5); // 箭头长度根据画笔大小调整
            const angle = Math.atan2(toY - fromY, toX - fromX);

            // 绘制主线
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            // 绘制箭头
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(
                toX - headLength * Math.cos(angle - Math.PI / 6),
                toY - headLength * Math.sin(angle - Math.PI / 6)
            );
            ctx.moveTo(toX, toY);
            ctx.lineTo(
                toX - headLength * Math.cos(angle + Math.PI / 6),
                toY - headLength * Math.sin(angle + Math.PI / 6)
            );
            ctx.stroke();
        }
        
        // 绘制曲线箭头预览
        function drawCurveArrowPreview() {
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            if (state.arrowPoints.length < 2) return;
            
            previewCtx.save();
            previewCtx.strokeStyle = state.foregroundColor;
            previewCtx.lineWidth = state.brushSize;
            previewCtx.setLineDash([5, 5]);
            
            // 绘制曲线路径
            previewCtx.beginPath();
            previewCtx.moveTo(state.arrowPoints[0].x, state.arrowPoints[0].y);
            
            if (state.arrowPoints.length === 2) {
                previewCtx.lineTo(state.arrowPoints[1].x, state.arrowPoints[1].y);
            } else {
                // 使用平滑曲线连接所有点
                for (let i = 1; i < state.arrowPoints.length; i++) {
                    const p0 = state.arrowPoints[i - 1];
                    const p1 = state.arrowPoints[i];
                    const midX = (p0.x + p1.x) / 2;
                    const midY = (p0.y + p1.y) / 2;
                    previewCtx.quadraticCurveTo(p0.x, p0.y, midX, midY);
                }
                // 连接到最后一点
                const last = state.arrowPoints[state.arrowPoints.length - 1];
                previewCtx.lineTo(last.x, last.y);
            }
            previewCtx.stroke();
            
            // 在终点绘制箭头预览
            const lastPoint = state.arrowPoints[state.arrowPoints.length - 1];
            const prevPoint = state.arrowPoints.length >= 2 
                ? state.arrowPoints[state.arrowPoints.length - 2] 
                : state.arrowPoints[0];
            drawArrowHead(previewCtx, prevPoint.x, prevPoint.y, lastPoint.x, lastPoint.y);
            
            previewCtx.restore();
        }
        
        // 完成绘制曲线箭头
        function drawCurveArrow() {
            if (state.arrowPoints.length < 2) return;
            
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            
            doodleCtx.save();
            doodleCtx.strokeStyle = state.foregroundColor;
            doodleCtx.lineWidth = state.brushSize;
            doodleCtx.lineCap = 'round';
            doodleCtx.lineJoin = 'round';
            
            // 绘制曲线路径
            doodleCtx.beginPath();
            doodleCtx.moveTo(state.arrowPoints[0].x, state.arrowPoints[0].y);
            
            if (state.arrowPoints.length === 2) {
                doodleCtx.lineTo(state.arrowPoints[1].x, state.arrowPoints[1].y);
            } else {
                // 使用平滑曲线连接所有点
                for (let i = 1; i < state.arrowPoints.length; i++) {
                    const p0 = state.arrowPoints[i - 1];
                    const p1 = state.arrowPoints[i];
                    const midX = (p0.x + p1.x) / 2;
                    const midY = (p0.y + p1.y) / 2;
                    doodleCtx.quadraticCurveTo(p0.x, p0.y, midX, midY);
                }
                // 连接到最后一点
                const last = state.arrowPoints[state.arrowPoints.length - 1];
                doodleCtx.lineTo(last.x, last.y);
            }
            doodleCtx.stroke();
            
            // 在终点绘制箭头
            const lastPoint = state.arrowPoints[state.arrowPoints.length - 1];
            const prevPoint = state.arrowPoints.length >= 2 
                ? state.arrowPoints[state.arrowPoints.length - 2] 
                : state.arrowPoints[0];
            drawArrowHead(doodleCtx, prevPoint.x, prevPoint.y, lastPoint.x, lastPoint.y);
            
            doodleCtx.restore();
            
            // 保存状态到撤销栈
            saveToUndoStack();
        }

        function drawShapePreview(startPoint, currentPoint) {
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

            const x = Math.min(startPoint.x, currentPoint.x);
            const y = Math.min(startPoint.y, currentPoint.y);
            const width = Math.abs(currentPoint.x - startPoint.x);
            const height = Math.abs(currentPoint.y - startPoint.y);

            if (width < 2 && height < 2) return;

            previewCtx.save();
            previewCtx.strokeStyle = state.foregroundColor;
            previewCtx.fillStyle = state.foregroundColor;
            previewCtx.lineWidth = state.strokeWidth;
            previewCtx.setLineDash([5, 5]);

            if (state.tool === 'rect') {
                if (state.fillType === 'solid') {
                    previewCtx.globalAlpha = 0.3;
                    previewCtx.fillRect(x, y, width, height);
                    previewCtx.globalAlpha = 1;
                    previewCtx.strokeRect(x, y, width, height);
                } else {
                    previewCtx.strokeRect(x, y, width, height);
                }
            } else if (state.tool === 'ellipse') {
                const centerX = x + width / 2;
                const centerY = y + height / 2;
                const radiusX = width / 2;
                const radiusY = height / 2;

                previewCtx.beginPath();
                previewCtx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);

                if (state.fillType === 'solid') {
                    previewCtx.globalAlpha = 0.3;
                    previewCtx.fill();
                    previewCtx.globalAlpha = 1;
                    previewCtx.stroke();
                } else {
                    previewCtx.stroke();
                }
            }

            previewCtx.restore();
        }

        function clearShapePreview() {
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        }
        
        // 辅助函数：将 HEX 颜色转换为 RGBA
        function hexToRgba(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function updatePreviewCanvas() {
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            
            // 只在绘制时显示预览光标
            if (!state.isDrawing || !state.lastPoint) return;
            
            // 计算实际的画笔半径（考虑硬度影响）
            const halfSize = state.brushSize / 2;
            const blurFactor = 2 * (1 - (state.brushHardness / 100));
            const blurRadius = halfSize * blurFactor;
            const outerRadius = halfSize + blurRadius;
            
            previewCtx.beginPath();
            if (state.brushShape === 'circle') {
                previewCtx.arc(state.lastPoint.x, state.lastPoint.y, outerRadius, 0, Math.PI * 2);
            } else {
                previewCtx.rect(
                    state.lastPoint.x - outerRadius,
                    state.lastPoint.y - outerRadius,
                    outerRadius * 2,
                    outerRadius * 2
                );
            }
            previewCtx.strokeStyle = state.foregroundColor;
            previewCtx.lineWidth = 1;
            previewCtx.setLineDash([4, 4]);
            previewCtx.stroke();
        }

        // ==================== 图像操作 ====================
        function triggerFileInput() {
            document.getElementById('fileInput').click();
        }

        function handleDrop(e) {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    // 设置画布大小
                    mainCanvas.width = img.width;
                    mainCanvas.height = img.height;
                    doodleCanvas.width = img.width;
                    doodleCanvas.height = img.height;
                    previewCanvas.width = img.width;
                    previewCanvas.height = img.height;
                    
            // 清空涂鸦层
            doodleCtx.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);
            
            // 清空文字图层
            clearAllText();
                    
                    // 绘制图像
                    ctx.drawImage(img, 0, 0);
                    state.baseImage = img;
                    state.imageLoaded = true;
                    
                    // 清空撤销历史
                    state.undoStack = [];
                    state.redoStack = [];
                    updateUndoRedoButtons();
                    
                    // 显示画布并设置容器大小
                    if (canvasContainer) {
                        canvasContainer.style.display = 'inline-block';
                        canvasContainer.style.width = img.width + 'px';
                        canvasContainer.style.height = img.height + 'px';
                    }
                    uploadHint.classList.add('hidden');
                    
                    // 更新尺寸显示
                    document.getElementById('canvasWidth').textContent = img.width;
                    document.getElementById('canvasHeight').textContent = img.height;
                    
                    // 重置视图
                    state.zoom = 1;
                    state.panX = 0;
                    state.panY = 0;
                    if (canvasContainer) updateCanvasTransform();
                    
                    // 适应屏幕
                    fitToScreen();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearAllText() {
            state.textElements = [];
            state.selectedTextElement = null;
            const textLayer = document.getElementById('textLayer');
            textLayer.innerHTML = '';
        }

        function clearCanvas() {
            if (!state.imageLoaded) return;
            
            // 保存状态以便撤销
            saveToUndoStack();
            
            doodleCtx.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);
            
            // 清空文字图层
            clearAllText();
        }

        function exportImage() {
            if (!state.imageLoaded) return;
            
            // 创建临时画布（不带棋盘格背景）
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = mainCanvas.width;
            tempCanvas.height = mainCanvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            
            // 如果有基础图像，先绘制基础图像
            if (state.baseImage) {
                tempCtx.drawImage(state.baseImage, 0, 0);
            }
            
            // 绘制涂鸦层
            tempCtx.drawImage(doodleCanvas, 0, 0);
            
            // 绘制文字元素
            state.textElements.forEach(textData => {
                tempCtx.save();
                tempCtx.font = `${textData.bold ? 'bold ' : ''}${textData.italic ? 'italic ' : ''}${textData.fontSize}px "Segoe UI", sans-serif`;
                tempCtx.fillStyle = textData.color;
                
                // 处理多行文字
                const text = textData.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                const lines = text.split('\n');
                const lineHeight = textData.fontSize * 1.3;

                lines.forEach((line, index) => {
                    const y = textData.y + textData.fontSize + index * lineHeight;
                    
                    if (textData.underline) {
                        const metrics = tempCtx.measureText(line);
                        tempCtx.fillText(line, textData.x, y);
                        const underlineY = y + 3;
                        tempCtx.beginPath();
                        tempCtx.moveTo(textData.x, underlineY);
                        tempCtx.lineTo(textData.x + metrics.width, underlineY);
                        tempCtx.strokeStyle = textData.color;
                        tempCtx.stroke();
                    } else {
                        tempCtx.fillText(line, textData.x, y);
                    }
                });
                tempCtx.restore();
            });
            
            // 下载
            const link = document.createElement('a');
            link.download = 'ps-brush-artwork.png';
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }
        
        function exportMaskImage() {
            if (!state.imageLoaded) return;
            
            // 创建临时画布
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = mainCanvas.width;
            tempCanvas.height = mainCanvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            
            // 获取涂鸦层的图像数据
            const maskData = doodleCtx.getImageData(0, 0, doodleCanvas.width, doodleCanvas.height);
            const data = maskData.data;
            
            // 第一步：二值化
            const alphaThreshold = 128;
            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] > alphaThreshold) {
                    data[i] = 255;
                    data[i + 1] = 255;
                    data[i + 2] = 255;
                    data[i + 3] = 255;
                } else {
                    data[i] = 0;
                    data[i + 1] = 0;
                    data[i + 2] = 0;
                    data[i + 3] = 255;
                }
            }
            
            // 第二步：边缘平滑 - 使用低通滤波
            const width = doodleCanvas.width;
            const height = doodleCanvas.height;
            
            // 创建副本用于平滑
            const originalData = new Uint8ClampedArray(data);
            const radius = 2; // 平滑半径
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const centerValue = originalData[idx]; // 中心像素值 (0 或 255)
                    
                    // 统计邻域内的白色像素数量
                    let whiteCount = 0;
                    let totalCount = 0;
                    
                    for (let dy = -radius; dy <= radius; dy++) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            const nx = x + dx;
                            const ny = y + dy;
                            
                            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                const nidx = (ny * width + nx) * 4;
                                if (originalData[nidx] > 128) {
                                    whiteCount++;
                                }
                                totalCount++;
                            }
                        }
                    }
                    
                    // 多数原则决定最终颜色
                    const threshold = (radius * 2 + 1) * (radius * 2 + 1) / 2;
                    if (whiteCount > threshold) {
                        data[idx] = 255;
                        data[idx + 1] = 255;
                        data[idx + 2] = 255;
                    } else {
                        data[idx] = 0;
                        data[idx + 1] = 0;
                        data[idx + 2] = 0;
                    }
                }
            }
            
            // 绘制处理后的掩码图
            tempCtx.putImageData(maskData, 0, 0);
            
            // 下载
            const link = document.createElement('a');
            link.download = 'mask.png';
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }

        // ==================== 视图控制 ====================
        function setZoom(newZoom) {
            state.zoom = Math.max(0.1, Math.min(10, newZoom));
            document.getElementById('zoomValue').textContent = Math.round(state.zoom * 100) + '%';
            if (canvasContainer) {
                updateCanvasTransform();
            }
        }

        function fitToScreen() {
            if (mainCanvas.width === 0 || mainCanvas.height === 0) return;
            const areaRect = canvasArea.getBoundingClientRect();
            const scaleX = (areaRect.width - 100) / mainCanvas.width;
            const scaleY = (areaRect.height - 100) / mainCanvas.height;
            setZoom(Math.min(scaleX, scaleY, 1));
        }

        function updateCanvasTransform() {
            canvasContainer.style.transform = `translate(-50%, -50%) translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
        }

        function updateCursor() {
            // 按住空格或选择抓手工具时显示抓手光标
            if (state.isSpacePressed || state.tool === 'move') {
                canvasArea.style.cursor = state.isPanning ? 'grabbing' : 'grab';
            } else {
                canvasArea.style.cursor = 'crosshair';
            }
        }

        // ==================== 键盘快捷键 ====================
        function handleKeyDown(e) {
            // 防止在输入框中触发（但允许 Ctrl+Z/Y）
            const isInputField = e.target.tagName === 'INPUT' || 
                                  e.target.tagName === 'TEXTAREA' || 
                                  e.target.contentEditable === 'true';
            
            const key = e.key.toLowerCase();
            
            // Ctrl+Z 撤销
            if (e.ctrlKey && key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undo();
                return;
            }
            
            // Ctrl+Y 或 Ctrl+Shift+Z 重做
            if ((e.ctrlKey && key === 'y') || (e.ctrlKey && e.shiftKey && key === 'z')) {
                e.preventDefault();
                redo();
                return;
            }
            
            if (isInputField) return;
            
            // 按住空格键临时激活抓手工具
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                if (!state.isSpacePressed) {
                    state.isSpacePressed = true;
                    updateCursor();
                }
                return;
            }
            
            // 工具切换
            if (key === 'b') { selectTool('brush'); return; }
            if (key === 'e') { selectTool('eraser'); return; }
            if (key === 'r') { selectTool('rect'); return; }
            if (key === 'o') { selectTool('ellipse'); return; }
            if (key === 'a') { selectTool('arrow'); return; }
            if (key === 't') { selectTool('text'); return; }
            if (key === 'v') { selectTool('move'); return; }
            
            // 删除选中文字
            if ((key === 'Delete' || key === 'Backspace') && state.selectedTextElement) {
                deleteTextElement(state.selectedTextElement.id);
                return;
            }
            
            // 清空涂鸦
            if (key === 'Delete' || key === 'Backspace') {
                clearCanvas();
                return;
            }
            
            // 画笔大小
            if (key === '[') {
                state.brushSize = Math.max(1, state.brushSize - 5);
                document.getElementById('brushSize').value = state.brushSize;
                updateBrushSettings();
            }
            if (key === ']') {
                state.brushSize = Math.min(500, state.brushSize + 5);
                document.getElementById('brushSize').value = state.brushSize;
                updateBrushSettings();
            }
            
            // 硬度
            if (key === '{') {
                state.brushHardness = Math.max(0, state.brushHardness - 10);
                document.getElementById('brushHardness').value = state.brushHardness;
                document.getElementById('hardnessValue').textContent = state.brushHardness + '%';
            }
            if (key === '}') {
                state.brushHardness = Math.min(100, state.brushHardness + 10);
                document.getElementById('brushHardness').value = state.brushHardness;
                document.getElementById('hardnessValue').textContent = state.brushHardness + '%';
            }
            
            // 不透明度 (1-9 = 10%-90%, 0 = 100%)
            if (key >= '1' && key <= '9') {
                state.brushOpacity = parseInt(key) * 10;
                document.getElementById('brushOpacity').value = state.brushOpacity;
                document.getElementById('opacityValue').textContent = state.brushOpacity + '%';
            }
            if (key === '0') {
                state.brushOpacity = 100;
                document.getElementById('brushOpacity').value = 100;
                document.getElementById('opacityValue').textContent = '100%';
            }
            
            // 保存
            if (e.ctrlKey && key === 's') { e.preventDefault(); exportImage(); return; }
            
            // 导出掩码图
            if (e.ctrlKey && key === 'm') { e.preventDefault(); exportMaskImage(); return; }
            
            // 缩放
            if (e.ctrlKey && (key === '=' || key === '+')) {
                e.preventDefault();
                setZoom(state.zoom + 0.1);
            }
            if (e.ctrlKey && key === '-') {
                e.preventDefault();
                setZoom(state.zoom - 0.1);
            }
            if (e.ctrlKey && key === '0') {
                e.preventDefault();
                fitToScreen();
            }
        }

        // ==================== 文字拖拽 ====================
        function handleTextDrag(e) {
            if (!state.draggingText || !state.selectedTextElement) return;
            
            // 如果还没开始拖拽，检查是否移动了足够的距离
            if (!state.dragStarted) {
                const dx = Math.abs(e.clientX - state.lastX);
                const dy = Math.abs(e.clientY - state.lastY);
                if (dx < 5 && dy < 5) return; // 移动距离不够，忽略
                state.dragStarted = true;
            }
            
            const containerRect = canvasContainer.getBoundingClientRect();
            const x = (e.clientX - containerRect.left) / state.zoom;
            const y = (e.clientY - containerRect.top) / state.zoom;
            
            state.selectedTextElement.x = x - state.dragOffsetX;
            state.selectedTextElement.y = y - state.dragOffsetY;
            updateTextElementDOM(state.selectedTextElement);
        }

        function handleTextDragEnd(e) {
            state.draggingText = false;
            state.dragStarted = false;
            // 拖拽结束后立即同步一次
            syncTextData();
        }

        function handleKeyUp(e) {
            // 释放空格键
            if (e.code === 'Space') {
                state.isSpacePressed = false;
                // 如果正在平移中，停止平移
                if (state.isPanning) {
                    state.isPanning = false;
                }
                updateCursor();
            }
        }

        function updateBrushSettings() {
            document.getElementById('sizeValue').textContent = state.brushSize + ' px';
            updateCurrentBrushDisplay();
        }

        function updateCurrentBrushDisplay() {
            const shape = state.brushShape === 'circle' ? '圆形' : '方形';
            document.getElementById('currentBrush').textContent = `${state.brushSize}px ${shape}`;
        }

        // 初始化
        init();
    </script>
</body>
</html>
