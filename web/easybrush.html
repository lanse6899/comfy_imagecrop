<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>easy brush</title>
    <script src="./js/comfyui_easybrush.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #2d2d2d;
            --bg-input: #3c3c3c;
            --border: #404040;
            --text: #e0e0e0;
            --text-dim: #888888;
            --accent: #ff6b35;
            --accent-blue: #4a9eff;
            --hover: #4a4a4a;
        }

        /* 浅色主题 */
        [data-theme="light"] {
            --bg-dark: #f5f5f5;
            --bg-panel: #ffffff;
            --bg-input: #eeeeee;
            --border: #dddddd;
            --text: #333333;
            --text-dim: #666666;
            --accent: #e55a2b;
            --accent-blue: #3a8be8;
            --hover: #e0e0e0;
        }

        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* 顶部工具栏 */
        .top-toolbar {
            height: 50px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
            margin-right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo svg {
            width: 24px;
            height: 24px;
        }

        .tool-group {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--bg-dark);
            border-radius: 6px;
        }

        .tool-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            transition: all 0.15s;
        }

        .tool-btn:hover {
            background: var(--hover);
        }

        .tool-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .tool-btn.active {
            background: var(--accent-blue);
            color: white;
        }

        .tool-btn svg {
            width: 20px;
            height: 20px;
        }

        .separator {
            width: 1px;
            height: 30px;
            background: var(--border);
            margin: 0 10px;
        }

        .history-group {
            display: flex;
            gap: 4px;
        }

        .spacer {
            flex: 1;
        }

        /* 主容器 */
        .main-container {
            display: flex;
            height: calc(100vh - 50px - 32px);
        }

        /* 左侧面板 */
        .left-panel {
            width: 260px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .panel-section {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* 滑块控制 */
        .slider-control {
            margin-bottom: 14px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .slider-label {
            font-size: 12px;
            color: var(--text);
        }

        .slider-value {
            font-size: 12px;
            color: var(--text-dim);
            min-width: 45px;
            text-align: right;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: var(--bg-dark);
            border-radius: 3px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--text);
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--accent-blue);
        }

        /* 形状选择 */
        .shape-options {
            display: flex;
            gap: 8px;
        }

        .shape-section {
            display: flex;
            gap: 8px;
        }

        .shape-btn {
            flex: 1;
            height: 36px;
            border: 1px solid var(--border);
            background: var(--bg-dark);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            transition: all 0.15s;
        }

        .shape-btn:hover {
            border-color: var(--text-dim);
        }

        .shape-btn.active {
            border-color: var(--accent-blue);
            background: var(--accent-blue);
        }

        /* 颜色选择 */
        .color-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-preview {
            position: relative;
            width: 44px;
            height: 44px;
        }

        .color-preview-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, #ccc 25%, transparent 25%),
                        linear-gradient(-45deg, #ccc 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #ccc 75%),
                        linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 8px 8px;
            background-position: 0 0, 0 4px, 4px -4px, -4px 0;
            border-radius: 4px;
        }

        .color-preview-fg {
            position: absolute;
            inset: 0;
            border-radius: 4px;
            cursor: pointer;
        }

        .color-preview-icon {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: var(--bg-panel);
            border: 2px solid var(--text);
            border-radius: 2px;
            cursor: pointer;
        }

        #foregroundColor {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .color-input-wrapper {
            flex: 1;
        }

        .color-input-wrapper input {
            width: 100%;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-dark);
            color: var(--text);
            padding: 0 10px;
            font-family: monospace;
            cursor: pointer;
        }

        /* 混合模式 */
        .blend-select {
            width: 100%;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-dark);
            color: var(--text);
            padding: 0 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .blend-select option {
            background: var(--bg-panel);
        }

        /* 画布区域 */
        .canvas-area {
            flex: 1;
            background: var(--bg-dark);
            position: relative;
            overflow: hidden;
        }

        .canvas-wrapper {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .canvas-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
        }

        .checkerboard {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-conic-gradient(
                #404040 0% 25%,
                #606060 0% 50%
            ) 50% / 16px 16px;
        }

        [data-theme="light"] .checkerboard {
            background: repeating-conic-gradient(
                #ffffff 0% 25%,
                #e0e0e0 0% 50%
            ) 50% / 16px 16px;
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        #doodleCanvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #previewCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        #textLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #textLayer .text-element {
            pointer-events: auto;
        }

        /* 上传提示 */
        .upload-hint {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            gap: 15px;
            pointer-events: none;
        }

        .upload-hint.hidden {
            display: none;
        }

        .upload-hint svg {
            width: 64px;
            height: 64px;
            opacity: 0.5;
        }

        .upload-hint p {
            font-size: 14px;
        }

        .upload-hint span {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* 历史面板 */
        .history-panel {
            padding: 10px 12px;
        }

        .history-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            padding: 6px 10px;
            font-size: 11px;
            color: var(--text-dim);
            border-radius: 3px;
            cursor: pointer;
        }

        .history-item:hover {
            background: var(--hover);
        }

        .history-item.current {
            background: var(--accent-blue);
            color: white;
        }

        /* 底部状态栏 */
        .status-bar {
            height: 32px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 20px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 快捷键提示 */
        .shortcut-hint {
            font-size: 10px;
            color: var(--text-dim);
            background: var(--bg-dark);
            padding: 2px 5px;
            border-radius: 2px;
            margin-left: 5px;
        }

        /* 工具提示 */
        [data-tooltip] {
            position: relative;
        }

        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 1000;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .left-panel {
                width: 220px;
            }
        }

        @media (max-width: 700px) {
            .left-panel {
                display: none;
            }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }

        /* 文字输入框 */
        .text-input-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .text-input-overlay.hidden {
            display: none;
        }

        .text-input-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            min-width: 300px;
        }

        .text-input-box h3 {
            margin: 0 0 0 0;
            font-size: 16px;
        }

        .text-input-box textarea {
            width: 100%;
            height: 120px;
            background: var(--bg-dark);
            border: none;
            border-radius: 4px;
            color: var(--text);
            padding: 0;
            font-size: 14px;
            resize: vertical;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            line-height: 1.5;
            margin: 10px 0 0 0;
        }

        .text-input-hint {
            font-size: 11px;
            color: var(--accent-blue);
            margin: 6px 0 0 0;
            opacity: 0.8;
        }

        .text-input-box textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .text-input-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .text-input-buttons button {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
        }

        .text-input-buttons .cancel-btn {
            background: var(--bg-dark);
            color: var(--text);
        }

        .text-input-buttons .cancel-btn:hover {
            background: var(--hover);
        }

        .text-input-buttons .confirm-btn {
            background: var(--accent-blue);
            color: white;
        }

        .text-input-buttons .confirm-btn:hover {
            opacity: 0.9;
        }

        /* 文字元素样式 */
        .text-element {
            position: absolute;
            cursor: move;
            user-select: none;
            padding: 0;
            margin: 0;
            border: none;
            border-radius: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: "Segoe UI", sans-serif;
            line-height: 1;
        }

        .text-element:hover {
            box-shadow: none;
        }

        .text-element.selected {
            box-shadow: none;
        }

        .text-element .delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 20px;
            height: 20px;
            background: #ff4444;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            display: none;
        }

        .text-element.selected .delete-btn {
            display: block;
        }

        /* 文字样式行 */
        .font-style-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .font-style-row .shape-btn {
            flex: none;
            width: 36px;
            height: 36px;
        }

        .font-style-row .shape-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        /* 描边粗细滑块行 */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .slider-row label {
            font-size: 12px;
            color: var(--text);
            min-width: 60px;
        }

        .slider-row input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: var(--bg-dark);
            border-radius: 3px;
            cursor: pointer;
        }

        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--text);
            border-radius: 50%;
            cursor: pointer;
        }

        .slider-row input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--accent-blue);
        }

        .slider-row span {
            font-size: 12px;
            color: var(--text-dim);
            min-width: 30px;
            text-align: right;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
    
    <!-- 顶部工具栏 -->
    <div class="top-toolbar">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                <path d="M2 2l7.586 7.586"/>
                <circle cx="11" cy="11" r="2"/>
            </svg>
            easy brush
        </div>

        <div class="tool-group">
            <button class="tool-btn active" id="brushTool" data-tooltip="画笔工具 [B]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                </svg>
            </button>
            <button class="tool-btn" id="eraserTool" data-tooltip="橡皮擦 [E]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 20H7L3 16l9-9 8 8-4 4"/>
                    <path d="M6 11l5 5"/>
                </svg>
            </button>
            <button class="tool-btn" id="rectTool" data-tooltip="矩形工具 [R]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                </svg>
            </button>
            <button class="tool-btn" id="ellipseTool" data-tooltip="圆形工具 [O]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                </svg>
            </button>
            <button class="tool-btn" id="arrowTool" data-tooltip="箭头工具 [A]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="19" x2="19" y2="5"/>
                    <polyline points="10 5 19 5 19 14"/>
                </svg>
            </button>
            <button class="tool-btn" id="textTool" data-tooltip="文字工具 [T]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="4 7 4 4 20 4 20 7"/>
                    <line x1="9" y1="20" x2="15" y2="20"/>
                    <line x1="12" y1="4" x2="12" y2="20"/>
                </svg>
            </button>
            <button class="tool-btn" id="moveTool" data-tooltip="移动工具 [V]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/>
                    <path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2"/>
                    <path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/>
                    <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
                </svg>
            </button>
        </div>

        <div class="separator"></div>

        <div class="tool-group">
            <button class="tool-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()" data-tooltip="上传图像">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </button>
            <button class="tool-btn" id="refreshImageBtn" data-tooltip="刷新图像" onclick="requestRefreshImage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 2v6h-6"/>
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                    <path d="M3 22v-6h6"/>
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                </svg>
            </button>
            <button class="tool-btn" id="exportBtn" data-tooltip="导出图像 [Ctrl+S]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </button>
            <button class="tool-btn" id="exportMaskBtn" data-tooltip="导出掩码图 [Ctrl+M]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <path d="M3 9h18"/>
                    <path d="M9 21V9"/>
                </svg>
            </button>
            <button class="tool-btn" id="undoBtn" data-tooltip="撤销 [Ctrl+Z]" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7v6h6"/>
                    <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
                </svg>
            </button>
            <button class="tool-btn" id="redoBtn" data-tooltip="重做 [Ctrl+Y]" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 7v6h-6"/>
                    <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/>
                </svg>
            </button>
            <button class="tool-btn" id="clearBtn" data-tooltip="清空涂鸦 [Del]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
            </button>
        </div>

        <div class="tool-group">
            <button class="tool-btn" id="zoomOutBtn" data-tooltip="缩小 [Ctrl+-]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    <line x1="8" y1="11" x2="14" y2="11"/>
                </svg>
            </button>
            <button class="tool-btn" id="zoomInBtn" data-tooltip="放大 [Ctrl++]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    <line x1="11" y1="8" x2="11" y2="14"/>
                    <line x1="8" y1="11" x2="14" y2="11"/>
                </svg>
            </button>
            <button class="tool-btn" id="fitBtn" data-tooltip="适应屏幕 [Ctrl+0]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <script>
        // ==================== 应用状态 ====================
        const state = {
            tool: 'brush', // brush, eraser, rect, ellipse, arrow, move, text
            isDrawing: false,
            isPanning: false,
            isSpacePressed: false, // 按住空格临时启用抓手
            spacePanStartX: 0,
            spacePanStartY: 0,
            lastX: 0,
            lastY: 0,
            lastPoint: null,
            
            // 画笔设置
            brushSize: 20,
            brushHardness: 100,
            brushOpacity: 100,
            brushFlow: 100,
            brushSpacing: 25,
            brushShape: 'circle', // circle, square
            foregroundColor: '#ff6b35',
            blendMode: 'normal',
            
            // 形状设置（矩形、圆形）
            fillType: 'solid', // solid, stroke
            strokeWidth: 2,
            shapeStartPoint: null, // 形状绘制起点
            shapePreviewId: null, // 预览形状ID
            
            // 曲线箭头路径点
            arrowPoints: [], // 存储曲线箭头的所有点
            
            // 画布设置
            zoom: 1,
            panX: 0,
            panY: 0,
            imageLoaded: false,
            
            // 图像数据
            baseImage: null,
            
            // 文字设置
            fontSize: 32,
            fontBold: false,
            fontItalic: false,
            fontUnderline: false,
            textElements: [], // 存储所有文字元素
            selectedTextElement: null, // 当前选中的文字元素
            draggingText: false,
            dragOffsetX: 0,
            dragOffsetY: 0,
            textInputPosition: null, // 文字输入位置
            
            // 撤销/重做
            undoStack: [], // 撤销栈
            redoStack: [], // 重做栈
            maxHistorySize: 50 // 最大历史记录数
        };

        // ==================== 主题管理 ====================
        let currentTheme = 'dark';

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                currentTheme = savedTheme;
                document.body.setAttribute('data-theme', currentTheme);
            }
        }

        // ==================== DOM 元素 ====================
        const canvasArea = document.getElementById('canvasArea');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const canvasContainer = document.getElementById('canvasContainer');
        const mainCanvas = document.getElementById('mainCanvas');
        const doodleCanvas = document.getElementById('doodleCanvas');
        const previewCanvas = document.getElementById('previewCanvas');
        const uploadHint = document.getElementById('uploadHint');
        const ctx = mainCanvas.getContext('2d', { willReadFrequently: true });
        const doodleCtx = doodleCanvas.getContext('2d');
        const previewCtx = previewCanvas.getContext('2d');
        let point = { x: 0, y: 0 };

        // ==================== 撤销/重做 ====================
        function saveToUndoStack() {
            // 分别保存 mainCanvas 和 doodleCanvas 的图像数据
            const mainImageData = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
            const doodleImageData = doodleCtx.getImageData(0, 0, doodleCanvas.width, doodleCanvas.height);
            const textElementsCopy = JSON.parse(JSON.stringify(state.textElements));
            
            state.undoStack.push({
                mainImageData: mainImageData,
                doodleImageData: doodleImageData,
                textElements: textElementsCopy
            });
            
            // 限制历史记录数量
            if (state.undoStack.length > state.maxHistorySize) {
                state.undoStack.shift();
            }
            
            // 清空重做栈
            state.redoStack = [];
            
            updateUndoRedoButtons();
        }

        function undo() {
            if (state.undoStack.length === 0) return;
            
            // 保存当前状态到重做栈
            const currentMainImageData = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
            const currentDoodleImageData = doodleCtx.getImageData(0, 0, doodleCanvas.width, doodleCanvas.height);
            const currentTextElements = JSON.parse(JSON.stringify(state.textElements));
            state.redoStack.push({
                mainImageData: currentMainImageData,
                doodleImageData: currentDoodleImageData,
                textElements: currentTextElements
            });
            
            // 恢复上一个状态
            const prevState = state.undoStack.pop();
            ctx.putImageData(prevState.mainImageData, 0, 0);
            doodleCtx.putImageData(prevState.doodleImageData, 0, 0);
            
            // 恢复文字元素
            state.textElements = prevState.textElements;
            rebuildTextElements();
            
            updateUndoRedoButtons();
        }

        function redo() {
            if (state.redoStack.length === 0) return;
            
            // 保存当前状态到撤销栈
            const currentMainImageData = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
            const currentDoodleImageData = doodleCtx.getImageData(0, 0, doodleCanvas.width, doodleCanvas.height);
            const currentTextElements = JSON.parse(JSON.stringify(state.textElements));
            state.undoStack.push({
                mainImageData: currentMainImageData,
                doodleImageData: currentDoodleImageData,
                textElements: currentTextElements
            });
            
            // 恢复重做状态
            const nextState = state.redoStack.pop();
            ctx.putImageData(nextState.mainImageData, 0, 0);
            doodleCtx.putImageData(nextState.doodleImageData, 0, 0);
            
            // 恢复文字元素
            state.textElements = nextState.textElements;
            rebuildTextElements();
            
            updateUndoRedoButtons();
        }

        function rebuildTextElements() {
            const textLayer = document.getElementById('textLayer');
            // 清除所有现有文字元素
            textLayer.innerHTML = '';
            
            // 重新创建所有文字元素
            state.textElements.forEach(textData => {
                const el = document.createElement('div');
                el.className = 'text-element';
                el.id = 'text-' + textData.id;
                el.dataset.id = textData.id;
                el.innerHTML = textData.text.replace(/\n/g, '<br>') + '<button class="delete-btn" onclick="deleteTextElement(' + textData.id + ')">×</button>';
                el.addEventListener('mousedown', onTextMouseDown);
                el.addEventListener('click', onTextClick);
                el.addEventListener('dblclick', onTextDblClick);
                updateTextElementDOM(textData, el);
                textLayer.appendChild(el);
            });
            
            // 取消选中
            state.selectedTextElement = null;
        }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById('undoBtn');
            const redoBtn = document.getElementById('redoBtn');
            if (undoBtn) undoBtn.disabled = state.undoStack.length === 0;
            if (redoBtn) redoBtn.disabled = state.redoStack.length === 0;
        }

        // ==================== 图像操作 ====================
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) loadImage(file);
        }

        // ==================== ComfyUI 消息通信 ====================
        window.addEventListener('message', (event) => {
            const data = event.data;
            
            if (data.type === 'INIT') {
                // 接收初始化设置
                if (data.brushSize) state.brushSize = data.brushSize;
                if (data.brushHardness) state.brushHardness = data.brushHardness;
                if (data.brushOpacity) state.brushOpacity = data.brushOpacity;
                updateBrushSettings();
            } else if (data.type === 'SYNC_SETTINGS') {
                // 同步设置
                if (data.brushSize) state.brushSize = data.brushSize;
                if (data.brushHardness) state.brushHardness = data.brushHardness;
                if (data.brushOpacity) state.brushOpacity = data.brushOpacity;
                updateBrushSettings();
            } else if (data.type === 'LOAD_IMAGE') {
                // 加载传入的图片
                console.log('EasyBrush iframe: Received LOAD_IMAGE', data);
                if (data.imageSrc) {
                    // 从 URL 加载
                    loadImageFromUrl(data.imageSrc);
                } else if (data.imageData) {
                    // 从 Base64 加载
                    loadImageFromBase64(data.imageData);
                }
            } else if (data.type === 'RESIZE') {
                // 处理窗口大小变化
                if (state.imageLoaded) {
                    fitToScreen();
                }
            } else if (data.type === 'GET_COMPOSED_IMAGE') {
                // 请求返回合成图像数据
                console.log('EasyBrush iframe: Received GET_COMPOSED_IMAGE');
                sendComposedImageData();
            }
        });

        // 请求父窗口刷新图像
        function requestRefreshImage() {
            console.log('EasyBrush: Requesting image refresh');
            state.imageLoaded = false;  // 重置状态以确保重新加载
            window.parent.postMessage({ type: 'REFRESH_IMAGE' }, '*');
        }

        // 发送合成图像数据到父窗口
        function sendComposedImageData() {
            if (!state.imageLoaded) {
                window.parent.postMessage({ type: 'COMPOSED_IMAGE_DATA', imageData: '' }, '*');
                return;
            }

            console.log('sendComposedImageData: mainCanvas size =', mainCanvas.width, 'x', mainCanvas.height, 'textElements:', state.textElements.length);
            // 创建临时画布来合成图像
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = mainCanvas.width;
            tempCanvas.height = mainCanvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            // 绘制原图
            if (state.baseImage) {
                console.log('Drawing baseImage');
                tempCtx.drawImage(state.baseImage, 0, 0);
            }

            // 绘制涂鸦层
            tempCtx.drawImage(doodleCanvas, 0, 0);

            // 绘制文字元素
            state.textElements.forEach(textData => {
                tempCtx.save();
                const fontStr = `${textData.bold ? 'bold ' : ''}${textData.italic ? 'italic ' : ''}${textData.underline ? 'underline ' : ''}${textData.fontSize}px "Segoe UI", sans-serif`;
                console.log('Drawing text:', textData.text, 'fontSize:', textData.fontSize, 'font:', fontStr);
                tempCtx.font = fontStr;
                tempCtx.fillStyle = textData.color || '#ffffff';
                tempCtx.textBaseline = 'top';

                const text = textData.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                const lines = text.split('\n');
                lines.forEach((line, lineIndex) => {
                    const x = textData.x;
                    const y = textData.y + lineIndex * textData.fontSize * 1.3;
                    tempCtx.fillText(line, x, y);
                });
                tempCtx.restore();
            });

            // 转换为 base64 并发送
            const imageData = tempCanvas.toDataURL('image/png');
            console.log('EasyBrush iframe: Sending composed image, length:', imageData.length);
            window.parent.postMessage({ type: 'COMPOSED_IMAGE_DATA', imageData: imageData }, '*');

            // 同时发送纯涂鸦掩码数据（白色涂鸦在黑色背景上）
            sendDoodleMaskData();
        }

        // 文字交互结束后同步数据到父窗口
        function syncTextData() {
            sendComposedImageData();
        }

        // 发送纯涂鸦掩码数据（用于生成MASK输出）
        function sendDoodleMaskData() {
            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = doodleCanvas.width;
            maskCanvas.height = doodleCanvas.height;
            const maskCtx = maskCanvas.getContext('2d');

            // 填充黑色背景
            maskCtx.fillStyle = 'black';
            maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);

            // 获取涂鸦数据
            const imageData = doodleCtx.getImageData(0, 0, doodleCanvas.width, doodleCanvas.height);
            const data = imageData.data;

            // 将有像素的区域转为白色
            for (let i = 0; i < data.length; i += 4) {
                // 检查 Alpha 通道，有绘制就设为白色
                if (data[i + 3] > 0) {
                    data[i] = 255;     // R
                    data[i + 1] = 255; // G
                    data[i + 2] = 255; // B
                    data[i + 3] = 255; // A
                }
            }

            // 放回画布
            maskCtx.putImageData(imageData, 0, 0);

            // 转换为 base64 并发送
            const maskData = maskCanvas.toDataURL('image/png');
            console.log('EasyBrush iframe: Sending doodle mask, length:', maskData.length);
            window.parent.postMessage({ type: 'DOODLE_MASK_DATA', maskData: maskData }, '*');
        }

        // 从 Base64 加载图片
        function loadImageFromBase64(base64Data) {
            const img = new Image();
            img.onload = () => {
                // 设置画布大小
                mainCanvas.width = img.width;
                mainCanvas.height = img.height;
                doodleCanvas.width = img.width;
                doodleCanvas.height = img.height;
                previewCanvas.width = img.width;
                previewCanvas.height = img.height;
                
                // 清空涂鸦层
                doodleCtx.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);
                
                // 清空文字图层
                clearAllText();
                
                // 绘制图像
                ctx.drawImage(img, 0, 0);
                state.baseImage = img;
                state.imageLoaded = true;
                
                // 清空撤销历史
                state.undoStack = [];
                state.redoStack = [];
                updateUndoRedoButtons();
                
                // 显示画布并设置容器大小
                if (canvasContainer) {
                    canvasContainer.style.display = 'inline-block';
                    canvasContainer.style.width = img.width + 'px';
                    canvasContainer.style.height = img.height + 'px';
                }
                if (uploadHint) uploadHint.classList.add('hidden');
                
                // 更新尺寸显示
                const widthEl = document.getElementById('canvasWidth');
                const heightEl = document.getElementById('canvasHeight');
                if (widthEl) widthEl.textContent = img.width;
                if (heightEl) heightEl.textContent = img.height;
                
                // 重置视图
                state.zoom = 1;
                state.panX = 0;
                state.panY = 0;
                if (canvasContainer) updateCanvasTransform();
                
                // 适应屏幕
                fitToScreen();
                
                // 通知父窗口图片已加载
                window.parent.postMessage({ type: 'IMAGE_LOADED' }, '*');
            };
            img.src = 'data:image/png;base64,' + base64Data;
        }
        
        // 从 URL 加载图片
        function loadImageFromUrl(url) {
            console.log('EasyBrush iframe: Loading image from URL:', url);
            const img = new Image();
            img.crossOrigin = 'anonymous';
            
            img.onload = () => {
                console.log('EasyBrush iframe: Image loaded from URL, size:', img.width, 'x', img.height);
                
                // 设置画布大小
                mainCanvas.width = img.width;
                mainCanvas.height = img.height;
                doodleCanvas.width = img.width;
                doodleCanvas.height = img.height;
                previewCanvas.width = img.width;
                previewCanvas.height = img.height;
                
                // 清空涂鸦层
                doodleCtx.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);
                
                // 清空文字图层
                clearAllText();
                
                // 绘制图像
                ctx.drawImage(img, 0, 0);
                state.baseImage = img;
                state.imageLoaded = true;
                
                // 清空撤销历史
                state.undoStack = [];
                state.redoStack = [];
                updateUndoRedoButtons();
                
                // 显示画布并设置容器大小
                if (canvasContainer) {
                    canvasContainer.style.display = 'inline-block';
                    canvasContainer.style.width = img.width + 'px';
                    canvasContainer.style.height = img.height + 'px';
                }
                if (uploadHint) uploadHint.classList.add('hidden');
                
                // 更新尺寸显示
                const widthEl = document.getElementById('canvasWidth');
                const heightEl = document.getElementById('canvasHeight');
                if (widthEl) widthEl.textContent = img.width;
                if (heightEl) heightEl.textContent = img.height;
                
                // 重置视图
                state.zoom = 1;
                state.panX = 0;
                state.panY = 0;
                if (canvasContainer) updateCanvasTransform();
                
                // 适应屏幕
                fitToScreen();
                
                // 通知父窗口图片已加载
                window.parent.postMessage({ type: 'IMAGE_LOADED' }, '*');
            };
            
            img.onerror = (e) => {
                console.error('EasyBrush iframe: Failed to load image from URL:', url, e);
            };
            
            img.src = url;
        }

        // ==================== 初始化 ====================
        function init() {
            initTheme();
            setupEventListeners();
            updateCursor();
            // 通知父窗口 iframe 已就绪
            window.parent.postMessage({ type: 'EASYBRUSH_READY' }, '*');
            // 监听窗口大小变化
            window.addEventListener('resize', () => {
                if (state.imageLoaded) {
                    fitToScreen();
                }
            });
        }

        // ==================== 事件监听 ====================
        function setupEventListeners() {
            // 主题切换
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            // 工具选择
            document.getElementById('brushTool').addEventListener('click', () => selectTool('brush'));
            document.getElementById('eraserTool').addEventListener('click', () => selectTool('eraser'));
            document.getElementById('rectTool').addEventListener('click', () => selectTool('rect'));
            document.getElementById('ellipseTool').addEventListener('click', () => selectTool('ellipse'));
            document.getElementById('arrowTool').addEventListener('click', () => selectTool('arrow'));
            document.getElementById('textTool').addEventListener('click', () => selectTool('text'));
            document.getElementById('moveTool').addEventListener('click', () => selectTool('move'));
            // 操作按钮
            document.getElementById('clearBtn').addEventListener('click', clearCanvas);
            document.getElementById('exportBtn').addEventListener('click', exportImage);
            document.getElementById('exportMaskBtn').addEventListener('click', exportMaskImage);
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);
            
            // 缩放按钮
            document.getElementById('zoomInBtn').addEventListener('click', () => setZoom(state.zoom + 0.25));
            document.getElementById('zoomOutBtn').addEventListener('click', () => setZoom(state.zoom - 0.25));
            document.getElementById('fitBtn').addEventListener('click', fitToScreen);

            // 形状选择（画笔笔刷形状）
            document.getElementById('circleShape').addEventListener('click', () => selectShape('circle'));
            document.getElementById('squareShape').addEventListener('click', () => selectShape('square'));

            // 填充方式选择
            document.getElementById('fillSolid').addEventListener('click', () => selectFillType('solid'));
            document.getElementById('fillStroke').addEventListener('click', () => selectFillType('stroke'));

            // 描边粗细
            document.getElementById('strokeWidth').addEventListener('input', (e) => {
                state.strokeWidth = parseInt(e.target.value);
                document.getElementById('strokeWidthValue').textContent = e.target.value + 'px';
            });

            // 颜色选择
            document.getElementById('foregroundColor').addEventListener('input', (e) => {
                state.foregroundColor = e.target.value;
                document.getElementById('fgPreview').style.background = e.target.value;
                document.getElementById('fgHex').value = e.target.value;
